name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Cake build
    runs-on: windows-2025

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Show Visual Studio installation
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.Component.MSBuild -property installationPath
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.Component.MSBuild -property installationVersion

      - name: Verify
        shell: pwsh
        run: .\build.ps1 -Target Verify -Configuration Release -Verbosity minimal

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: razor-generator-artifacts
          path: artifacts/**
          if-no-files-found: error
